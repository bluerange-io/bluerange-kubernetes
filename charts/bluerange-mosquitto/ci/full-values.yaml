ingress:
  enabled: true
  hosts:
    - host: test-mosquitto.bluerange.io
      paths:
        - path: /
          pathType: ImplementationSpecific

ingressRoute:
  mqtts:
    enabled: true
    matchRule: "HostSNI(`test-mosquitto.bluerange.io`)"
    entryPoints:
      - mqtts

bluerangeMosquitto:
  mqtts:
    enabled: true

  environment:
    BLUERANGE_HOSTNAME: bluerange-server
    BLUERANGE_PORT: "80"
    BLUERANGE_WITH_TLS: "false"
    MOSQUITTO_LISTENERS: "auto"
    MOSQUITTO_MAX_LOGIN_ATTEMPTS: "30"
    PROMETHEUS_PASSWORD: "random-secret"
    BLUERANGE_DISABLE_MONITORING: "false"
