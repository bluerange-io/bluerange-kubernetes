ingress:
  enabled: true
  hosts:
    - host: '{{ required "bluerangeServer.config.relution.server.externalURL is required!" .Values.bluerangeServer.config.relution.server.externalURL | replace "https://" "" }}'
      paths:
        - path: /
          pathType: ImplementationSpecific

autoscaling:
  enabled: true

bluerangeServer:
  config:
    relution:
      server:
        externalURL: https://test.bluerange.io
      database:
        type: mariadb
        url: jdbc:mariadb://mariadb:3306/bluerange
        username: bluerange
        password: bluerange
      mongodb:
        enabled: true
        host: mongodb
        port: 27017
        database: bluerange
        username: bluerange
        password: bluerange

additionalInitContainers:
  - name: busybox-init
    image: busybox:latest

additionalSidecarContainers:
  - name: nginx-sidecar
    image: nginx:latest
    restartPolicy: Always

s2s:
  enabled: true
  livenessProbe:
    enabled: false
  psk: "sharedsecret"
  separateChildSas: false
  remote:
    ip: 1.2.3.4
    subnets:
      - 192.168.178.10/32
      - 192.168.178.20/32
      - 192.168.178.30/32
  local:
    nat: 10.10.10.10
    transferSubnet: 10.10.10.10/32

mariadb:
  enabled: true
  fullnameOverride: mariadb

mongodb:
  enabled: true
  fullnameOverride: mongodb

# Pod-level security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 20001
  runAsGroup: 20001
  fsGroup: 20001
  seccompProfile:
    type: RuntimeDefault

# Container-level security context
securityContext:
  runAsNonRoot: true
  runAsUser: 20001
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
