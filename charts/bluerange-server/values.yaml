replicaCount: 1

image:
  repository: bluerange/bluerange
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

hostAliases: []

terminationGracePeriodSeconds: ~

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

startupProbe:
  enabled: true
  failureThreshold: 60
  periodSeconds: 10
  timeoutSeconds: 1
livenessProbe:
  enabled: true
  failureThreshold: 3
  periodSeconds: 10
  timeoutSeconds: 1
readinessProbe:
  enabled: true
  failureThreshold: 3
  periodSeconds: 10
  timeoutSeconds: 1


resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

bluerangeServer:
  config:
    mqtt:
      enabled: true
      server_uris: tcp://bluerange-mosquitto:1883
  environment:
    RELUTION_OPTS: -XX:MinRAMPercentage=50.0 -XX:MaxRAMPercentage=40.0
  secrets: {}
  existingSecretRefs: []
  restore:
    postgresql:
      enabled: false

additionalInitContainers: []
additionalSidecarContainers: []

additionalVolumes: []
additionalVolumeMounts: []

# The heap dump exporter sidecar is intended to be used for debugging by our development team.
heapDumpExporter:
  directory: /opt/relution/log
  emptyDir:
    sizeLimit: 5Gi
  hostPath:
    enabled: false

s2s:
  enabled: false
  # Create one IPsec child SA per remote subnet instead of a single
  # child SA covering all subnets.
  separateChildSas: false
  # Optional command executed by the health check script after the SA checks.
  # If it fails, its output is logged and the tunnel is reinitiated.
  healthcheckCommand: ""
  image:
    repository: relution/s2s-docker
    pullPolicy: IfNotPresent
    tag: "1.1.0"
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
  logLevel: 1
  psk: ""
  ike:
    proposals: sha512-aes256-ecp384
    rekeyTime: "4h"
  ipsec:
    proposals: chacha20poly1305-ecp384
    rekeyTime: "1h"
    startAction: start
    closeAction: start
    dpdAction: restart
  remote:
    ip: ""
    subnets: []
  local:
    id: bluerange
    nat: ""
    transferSubnet: ""

# MariaDB is provided as a dependency to enable quick debugging. We recommend deploying BlueRange on a dedicated database cluster.
mariadb:
  enabled: false
  auth:
    ## Choose a secure password before deploying BlueRange.
    # rootPassword:
    database: bluerange
    username: bluerange
    ## Choose a secure password before deploying BlueRange.
    # password:

mongodb:
  enabled: false
  auth:
    rootUser: admin
    ## Choose a secure password before deploying BlueRange.
    # rootPassword:
  customUser:
    database: bluerange
    name: bluerange
    ## Choose a secure password before deploying BlueRange.
    # password:
